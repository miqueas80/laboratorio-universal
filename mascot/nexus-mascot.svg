<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 260" role="img" aria-labelledby="title desc">
<title id="title">NEXUS, robot mascota del laboratorio</title>
<desc id="desc">Robot metálico amistoso con orejas luminosas y ojos celestes, flotando y saludando.</desc>
<defs>
  <linearGradient id="shell" x1=".18" y1=".03" x2=".9" y2=".99"><stop stop-color="#fff"/><stop offset=".42" stop-color="#e8f2fa"/><stop offset=".76" stop-color="#879dac"/><stop offset="1" stop-color="#fff"/></linearGradient>
  <linearGradient id="ears" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#e8faff"/><stop offset=".5" stop-color="#52687e"/><stop offset="1" stop-color="#091b36"/></linearGradient>
  <linearGradient id="visor" x1=".1" x2=".85" y1="0" y2="1"><stop stop-color="#243a56"/><stop offset=".39" stop-color="#06172b"/><stop offset="1" stop-color="#030812"/></linearGradient>
  <linearGradient id="body" x1="0" x2=".85" y1="0" y2=".95"><stop stop-color="#fff"/><stop offset=".48" stop-color="#bdcbd8"/><stop offset="1" stop-color="#526b84"/></linearGradient>
  <linearGradient id="screen" x1="0" x2=".9" y1="0" y2="1"><stop stop-color="#144c94" stop-opacity=".94"/><stop offset="1" stop-color="#0c1533" stop-opacity=".88"/></linearGradient>
  <radialGradient id="light"><stop stop-color="#c9faff"/><stop offset=".4" stop-color="#5aeaff"/><stop offset="1" stop-color="#0083ff"/></radialGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#011529" flood-opacity=".5"/></filter>
</defs>
<g opacity=".73" fill="none" stroke="#38ceff" stroke-width="2"><ellipse cx="128" cy="127" rx="117" ry="65" transform="rotate(-19 128 127)" stroke-dasharray="90 20 42 20"/><circle cx="24" cy="140" r="5" fill="#22baff"/></g>
