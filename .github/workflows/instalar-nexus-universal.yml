name: Instalar NEXUS-X Universal
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instalar-nexus-universal.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instalar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio nuevo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Obtener distribucion limpia, sin historial escolar
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth=1 --single-branch --branch institucional-limpia-2026-10-11 https://github.com/miqueas80/Laboratorio2.0.git /tmp/nexus-universal-clean
          test "$(git -C /tmp/nexus-universal-clean rev-parse HEAD)" = "e610581940e5c3d6b59a1bd14c844d8fd1056c6e"
          test -f /tmp/nexus-universal-clean/app.js
          test -f /tmp/nexus-universal-clean/offline/v1/vision/mobileclip-s0.onnx
          test -f /tmp/nexus-universal-clean/offline/v1/voice/vosk-es.tar.gz
          test "$(node -p "require('/tmp/nexus-universal-clean/inventory.json').records.length")" = 0
          test "$(node -p "require('/tmp/nexus-universal-clean/documents-manifest.json').documents.length")" = 0
          if find /tmp/nexus-universal-clean -type f \( -iname '*.pdf' -o -iname '*.docx' -o -iname '*.xlsx' -o -iname '*.xls' -o -iname '*.csv' \) -print -quit | grep -q .; then
            echo "ERROR: se encontro un archivo escolar" >&2
            exit 1
          fi
      - name: Instalar codigo y modelos, validar, publicar
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --exclude='.git' --exclude='.github' /tmp/nexus-universal-clean/ ./
          node --test tests/clean-distribution.test.mjs
          rm -f .github/workflows/instalar-nexus-universal.yml
          git config user.name 'NEXUS-X Universal'
          git config user.email 'nexus-universal@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Instalar NEXUS-X Universal limpio con motores offline"
          git push origin HEAD:main
