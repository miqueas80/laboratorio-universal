name: NEXUS Universal - Laboratorio seguro
on:
  push:
    branches:
      - lab/nexus-universal-modernizacion-20261015
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: universal-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Universal regression suite
        run: npm test
      - name: Syntax check of browser code and workers
        run: |
          node --check app.js
          node --check sw.js
          node --check config.js
          node --check offline/core.js
          node --check offline/knowledge.js
          node --check offline/vision-worker.js
          node --check offline/ocr-worker.js
  browser:
    name: Chromium PWA offline E2E
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test runner
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.64.1
      - name: Install Chromium and runtime dependencies
        run: npx playwright install --with-deps chromium
      - name: Exercise universal PWA in real Chromium, online and offline
        run: node scripts/universal-browser-smoke.cjs

  lens-real:
    name: Real offline MobileCLIP and OCR
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test runner
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.64.1
      - name: Install Chromium and runtime dependencies
        run: npx playwright install --with-deps chromium
      - name: Test actual MobileCLIP and OCR inference online and cold offline
        run: node scripts/universal-lens-real.cjs

  package:
    name: Clean production distribution ZIP
    needs: [verify, browser, lens-real]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build a history-free, data-free ZIP with SHA256
        run: bash scripts/package-universal.sh
      - name: Upload private tested Universal distribution
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-X-Universal-tested
          path: |
            NEXUS-X-Universal-distribucion.zip
            NEXUS-X-Universal-distribucion.zip.sha256
          if-no-files-found: error
          retention-days: 14
